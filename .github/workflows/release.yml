name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      # Opens / updates the "chore: release" PR; publishes when that PR is merged.
      # No npm token: the package trusts this workflow on npmjs.com (Trusted Publishing).
      - uses: changesets/action@v2
        with:
          publish-script: npm run release
          commit-message: 'chore: release'
          pr-title: 'chore: release'
